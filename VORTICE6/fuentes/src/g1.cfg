# Vórtice 6 · fase 1 jugable · ld65
MEMORY {
    ZP:   start = $0080, size = $0080, type = rw, define = yes;
    INIT: start = $0600, size = $0100, type = rw, file = "build/init.bin";
    MAIN: start = $2000, size = $7000, type = rw, file = "build/main.bin";
    HI:   start = $9000, size = $1000, type = rw, file = "";   # RAM con el BASIC desconectado
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    INITSEG:  load = INIT, type = rw;
    CODE:     load = MAIN, type = rw, align = $40;
    HIBSS:    load = HI,   type = bss;
}
