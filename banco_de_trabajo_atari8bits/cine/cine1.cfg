# Vórtice 6 · intro + historia + PANEL DE MANDO (menú) · ld65
#   $2000-$4FFF código y datos · $5010-$6E0F imagen de la intro · $6E10 panel comprimido
#   en marcha: panel descomprimido en $8010-$9E0F, variables en $A000, jugadores en $A800
MEMORY {
    ZP:   start = $0080, size = $0080, type = rw, define = yes;
    INIT: start = $0600, size = $0100, type = rw, file = "build/init.bin";
    MAIN: start = $2000, size = $6000, type = rw, file = "build/main.bin";
    HI:   start = $A000, size = $0800, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    INITSEG:  load = INIT, type = rw;
    CODE:     load = MAIN, type = rw, align = $400;
    PICA:     load = MAIN, type = rw, start = $5010;
    PICB:     load = MAIN, type = rw, start = $6000;
    MDATA:    load = MAIN, type = rw, start = $6E10;
    HIBSS:    load = HI,   type = bss;
}
